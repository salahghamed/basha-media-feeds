name: Refresh Basha network statistics
on:
  workflow_dispatch:
  schedule:
    - cron: '8,23,38,53 * * * *'
permissions:
  contents: read
concurrency:
  group: basha-live-stats
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify statistics calculations
        run: node --test stats.test.mjs
      - name: Refresh cached public-safe statistics
        run: node stats-sync.mjs
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ARCHIVE_NAMESPACE_ID: ${{ vars.ARCHIVE_NAMESPACE_ID }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          ANDROID_BASHA_REFRESH_TOKEN: ${{ secrets.ANDROID_BASHA_REFRESH_TOKEN }}
          CAMERA_BASHA_REFRESH_TOKEN: ${{ secrets.CAMERA_BASHA_REFRESH_TOKEN }}
          BASHA_PODCAST_REFRESH_TOKEN: ${{ secrets.BASHA_PODCAST_REFRESH_TOKEN }}
          HIFI_BASHA_REFRESH_TOKEN: ${{ secrets.HIFI_BASHA_REFRESH_TOKEN }}
          GAMING_BASHA_REFRESH_TOKEN: ${{ secrets.GAMING_BASHA_REFRESH_TOKEN }}

name: Update public Basha channel feeds
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
concurrency:
  group: basha-feed-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        channel: [android, camera, podcast]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Unpack source package
        run: |
          base64 --decode sync-package.b64 > sync-package.zip
          unzip -q sync-package.zip -d sync-package
      - name: Verify service
        run: node --test sync-package/tests.mjs
      - name: Refresh and publish feed
        run: node sync-package/sync.mjs "${{ matrix.channel }}"
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ARCHIVE_NAMESPACE_ID: ${{ vars.ARCHIVE_NAMESPACE_ID }}
          YOUTUBE_FULL_EPISODES_PLAYLIST_ID: ${{ vars.YOUTUBE_FULL_EPISODES_PLAYLIST_ID }}
          PODCAST_RSS_URL: https://anchor.fm/s/fdba5308/podcast/rss
